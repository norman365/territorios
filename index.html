<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Registro de Territorios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Registro de Territorios</h1>

<nav class="tabs">
  <button onclick="mostrarVista('carga')">Cargar</button>
  <button onclick="mostrarVista('reporte')">Reporte</button>
</nav>

<section id="vistaCarga" class="card">
  <h2>Cargar territorio</h2>

  <label>Territorio</label>

  <select id="territorio">
    <option value="">Seleccionar territorio...</option>
  </select>

  <label>Fecha inicio</label>
  <input id="fechaInicio" type="date">

  <label>Fecha fin</label>
  <input id="fechaFin" type="date">

  <label>Observaciones</label>
  <textarea id="observaciones"></textarea>

  <button onclick="guardar()">Guardar</button>
</section>

<section id="vistaReporte" class="card oculto">
  <h2>Reporte</h2>
  <div id="reporte" class="grid"></div>

  <div id="panelFinalizar" class="panel-finalizar oculto">
    <h3>Finalizar territorio</h3>

    <input type="hidden" id="idRegistroAsignado">

    <label>Territorio</label>
    <input id="territorioFinalizar" type="text" readonly>

    <label>Fecha fin real</label>
    <input id="fechaFinFinalizar" type="date">

    <button onclick="finalizarTerritorio()">Finalizar</button>
    <button class="btn-secundario" onclick="cerrarPanelFinalizar()">Cancelar</button>
  </div>
</section>

<div id="panelDetalle" class="panel-finalizar oculto">
  <h3 id="tituloDetalle">Detalle territorio</h3>

  <div id="detalleTerritorio"></div>

  <button class="btn-secundario" onclick="cerrarDetalleTerritorio()">
    Volver
  </button>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
